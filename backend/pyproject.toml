[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "saga-agent"
version = "0.1.0"
description = "Durable RFQ worker with reconciliation, approvals and sandbox replay"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "sqlmodel>=0.0.48,<0.1", "SQLAlchemy>=2.0,<2.1", "aiosqlite>=0.20,<1", "pydantic>=2.11,<3", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "httpx>=0.28,<1"]
postgres = ["asyncpg>=0.30,<1"]

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[tool.setuptools.package-data]
app = ["db/seed/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
